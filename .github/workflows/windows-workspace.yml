name: Skyport Windows Workspace

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  windows-workspace:
    name: Configure Windows VPS
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Windows runner
        shell: pwsh
        run: |
          Write-Host "Runner: $env:COMPUTERNAME"
          Write-Host "User: $env:USERNAME"
          Get-ComputerInfo |
            Select-Object WindowsProductName, WindowsVersion
          Write-Host "Persistent workspace is on this Windows machine."

      - name: Check required secrets
        shell: pwsh
        env:
          RDP_USER: ${{ secrets.RDP_USER }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_USER)) {
            throw "Add RDP_USER in repository Actions secrets."
          }
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Add RDP_PASSWORD in repository Actions secrets."
          }

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java
        shell: pwsh
        run: |
          java -version
          javac -version

      - name: Install VS Code
        shell: pwsh
        run: |
          if (Get-Command code -ErrorAction SilentlyContinue) {
            Write-Host "VS Code is already installed."
          } elseif (Get-Command winget -ErrorAction SilentlyContinue) {
            winget install --id Microsoft.VisualStudioCode `
              --exact --silent `
              --accept-package-agreements `
              --accept-source-agreements
          } else {
            Write-Warning "winget is unavailable. Install VS Code manually on the VPS."
          }

      - name: Configure RDP account and Windows settings
        shell: pwsh
        env:
          RDP_USER: ${{ secrets.RDP_USER }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          $account = Get-LocalUser -Name $env:RDP_USER `
            -ErrorAction SilentlyContinue

          if ($null -eq $account) {
            New-LocalUser -Name $env:RDP_USER `
              -Password $securePassword `
              -Description "Skyport RDP account"
          } else {
            Set-LocalUser -Name $env:RDP_USER `
              -Password $securePassword
          }

          Enable-LocalUser -Name $env:RDP_USER

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $env:RDP_USER `
            -ErrorAction SilentlyContinue

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Write-Host "RDP configured. Use Tailscale for private access."

      - name: Check Tailscale
        shell: pwsh
        run: |
          $ts = Get-Command tailscale -ErrorAction SilentlyContinue

          if ($null -eq $ts) {
            Write-Warning "Tailscale is not installed or not on PATH."
            Write-Warning "Install it on the VPS and sign in to your tailnet."
          } else {
            tailscale status
            tailscale ip -4
          }

      - name: Create persistent workspace
        shell: pwsh
        run: |
          $base = "C:\RDP-Workspace"

          New-Item -ItemType Directory -Force -Path `
            "$base\Projects", `
            "$base\Minecraft", `
            "$base\Backups" | Out-Null

          @"
          Skyport persistent workspace
          Java: 21
          Projects: $base\Projects
          Minecraft: $base\Minecraft
          Backups: $base\Backups
          "@ | Set-Content "$base\README.txt"

          Write-Host "Workspace location: $base"

      - name: Check graphics adapter
        shell: pwsh
        run: |
          Get-CimInstance Win32_VideoController |
            Select-Object Name, DriverVersion

      - name: Upload workspace snapshot
        uses: actions/upload-artifact@v4
        with:
          name: skyport-workspace-${{ github.run_number }}
          path: C:\RDP-Workspace\README.txt
          if-no-files-found: error
          retention-days: 30
