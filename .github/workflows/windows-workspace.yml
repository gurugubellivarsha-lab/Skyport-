name: Skyport Windows Workspace

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-workspace:
    name: Configure Temporary Windows Workspace
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Windows and Java
        shell: pwsh
        run: |
          Write-Host "Windows runner is working."
          Write-Host "Computer: $env:COMPUTERNAME"
          java -version

      - name: Create workspace
        shell: pwsh
        run: |
          $base = Join-Path $env:GITHUB_WORKSPACE "RDP-Workspace"

          New-Item -ItemType Directory -Force -Path `
            "$base\Projects", `
            "$base\Minecraft", `
            "$base\Backups" | Out-Null

          @"
          Skyport Windows Workspace
          Java: 21
          Projects: $base\Projects
          Minecraft: $base\Minecraft
          "@ | Set-Content "$base\README.txt"

      - name: Check graphics adapter
        shell: pwsh
        run: |
          Get-CimInstance Win32_VideoController |
            Select-Object Name, DriverVersion

      - name: Upload workspace artifact
        uses: actions/upload-artifact@v5
        with:
          name: skyport-workspace-${{ github.run_number }}
          path: RDP-Workspace/
          if-no-files-found: error
          retention-days: 7
