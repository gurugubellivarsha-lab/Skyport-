
name: Windows Workspace with Tailscale

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  setup:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Restore previous workspace
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: windows-workspace.yml
          name: windows-workspace
          path: restored
          if_no_artifact_found: warn

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci

      - name: Install Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install VS Code
        shell: pwsh
        run: |
          winget install --id Microsoft.VisualStudioCode `
            --exact --silent `
            --accept-package-agreements `
            --accept-source-agreements

      - name: Prepare and restore workspace
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force `
            workspace, workspace/Minecraft, workspace/Projects |
            Out-Null

          if (Test-Path restored) {
            Copy-Item restored/* workspace/ -Recurse -Force
          }

          java --version
          javac --version

      - name: Check graphics hardware
        shell: pwsh
        run: |
          Get-CimInstance Win32_VideoController |
            Select-Object Name, DriverVersion |
            Format-List

          Write-Host "OpenGL support depends on the graphics driver."

      - name: Check RDP secrets
        shell: pwsh
        env:
          RDP_USER: ${{ secrets.RDP_USER }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_USER) -or
              [string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            Write-Host "RDP credentials are not configured."
          } elseif ($env:RDP_PASSWORD.Length -lt 16) {
            throw "Use an RDP password with at least 16 characters."
          } else {
            Write-Host "Credentials validated."
          }

      - name: Save workspace backup
        uses: actions/upload-artifact@v4
        with:
          name: windows-workspace
          path: workspace/
          retention-days: 30
          if-no-files-found: error
          
