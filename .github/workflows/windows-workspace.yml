name: Windows RDP Setup and Backup

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  setup:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    steps:
      - name: Verify Windows and Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-ComputerInfo | Select-Object WindowsProductName
          if (-not (Get-Command tailscale -ErrorAction SilentlyContinue)) {
            throw "Install Tailscale on this VPS first."
          }
          tailscale status

      - name: Configure Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install VS Code
        shell: pwsh
        run: |
          winget install --id Microsoft.VisualStudioCode `
            --exact --silent `
            --accept-package-agreements `
            --accept-source-agreements

      - name: Configure authorized RDP account
        shell: pwsh
        env:
          RDP_USER: ${{ secrets.RDP_USER }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_USER) -or
              [string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Configure RDP_USER and RDP_PASSWORD secrets."
          }

          if ($env:RDP_PASSWORD.Length -lt 16) {
            throw "Use a password of at least 16 characters."
          }

          $secure = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          $account = Get-LocalUser -Name $env:RDP_USER `
            -ErrorAction SilentlyContinue

          if ($null -eq $account) {
            New-LocalUser -Name $env:RDP_USER `
              -Password $secure `
              -Description "Authorized RDP account"
          } else {
            Set-LocalUser -Name $env:RDP_USER `
              -Password $secure
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $env:RDP_USER `
            -ErrorAction SilentlyContinue

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name fDenyTSConnections -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Write-Host "RDP account configured."

      - name: Check Java and graphics
        shell: pwsh
        run: |
          java --version
          javac --version

          Get-CimInstance Win32_VideoController |
            Select-Object Name, DriverVersion |
            Format-Table -AutoSize

          Write-Host "OpenGL capability depends on the installed GPU driver."

      - name: Prepare Minecraft workspace
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force `
            C:\RDP-Workspace\Minecraft, `
            C:\RDP-Workspace\Projects | Out-Null

      - name: Save workspace backup
        uses: actions/upload-artifact@v4
        with:
          name: windows-workspace
          path: C:\RDP-Workspace
          retention-days: 30
          if-no-files-found: error
          
