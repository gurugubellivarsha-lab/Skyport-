
name: Windows RDP + Tailscale + Minecraft

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rdp:
    runs-on: windows-2025
    timeout-minutes: 350

    steps:
      - name: Generate RDP Password and Configure Account
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $bytes = New-Object byte[] 24
          [System.Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $password = [Convert]::ToBase64String($bytes) + "aA1!"

          $secure = ConvertTo-SecureString $password -AsPlainText -Force

          if (Get-LocalUser -Name "rdpuser" -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name "rdpuser" -Password $secure
          } else {
            New-LocalUser -Name "rdpuser" -Password $secure -PasswordNeverExpires
          }

          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "rdpuser" -ErrorAction SilentlyContinue

          Set-ItemProperty `
            "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name fDenyTSConnections -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-Service TermService -StartupType Automatic
          Start-Service TermService

          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\mn" | Out-Null

          @"
          RDP Username: rdpuser
          RDP Password: $password
          RDP Port: 3389
          "@ | Set-Content "$env:GITHUB_WORKSPACE\mn\mn.txt"

          Write-Host "RDP account created and connection file generated."

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - name: Install Minecraft Launcher
        shell: pwsh
        run: |
          winget install `
            --id Mojang.MinecraftLauncher `
            --exact `
            --silent `
            --accept-source-agreements `
            --accept-package-agreements `
            --disable-interactivity

      - name: Save RDP Connection File
        uses: actions/upload-artifact@v4
        with:
          name: mn
          path: mn/mn.txt
          retention-days: 1

      - name: Show Tailscale Address
        shell: pwsh
        run: |
          $ip = (tailscale ip -4 | Select-Object -First 1).Trim()
          Write-Host "RDP Address: ${ip}:3389"
          Write-Host "Username: rdpuser"
          Write-Host "Download the mn artifact for the password."
          while ($true) {
            Start-Sleep -Seconds 30
          }
          
