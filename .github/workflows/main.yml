
name: Windows RDP and Minecraft Launcher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-rdp:
    runs-on: windows-2025
    timeout-minutes: 350

    steps:
      - name: Install Java for Minecraft
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - name: Verify Java
        shell: pwsh
        run: |
          java -version
          if ($LASTEXITCODE -ne 0) {
            throw "Java installation failed."
          }

      - name: Configure Temporary RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $bytes = New-Object byte[] 24
          [System.Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $password = [Convert]::ToBase64String($bytes) + "aA1!"

          $secure = ConvertTo-SecureString $password -AsPlainText -Force

          if (Get-LocalUser -Name "rdpuser" -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name "rdpuser" -Password $secure
          } else {
            New-LocalUser -Name "rdpuser" -Password $secure
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "rdpuser" `
            -ErrorAction SilentlyContinue

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name fDenyTSConnections -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-Service TermService -StartupType Automatic
          Start-Service TermService

          Write-Host "::add-mask::$password"
          "RDP_PASSWORD=$password" | Out-File $env:GITHUB_ENV -Append

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Install Minecraft Launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          winget install `
            --id Mojang.MinecraftLauncher `
            --exact `
            --silent `
            --accept-source-agreements `
            --accept-package-agreements `
            --disable-interactivity

          if ($LASTEXITCODE -ne 0) {
            throw "Minecraft Launcher installation failed."
          }

      - name: Show Connection Information
        shell: pwsh
        run: |
          $ip = (tailscale ip -4 | Select-Object -First 1).Trim()

          Write-Host "RDP address: ${ip}:3389"
          Write-Host "Username: rdpuser"
          Write-Host "Password is generated for this run."
          Write-Host "Minecraft Launcher installation attempted."
          Write-Host "The runner is temporary."

          while ($true) {
            Start-Sleep -Seconds 30
          }
          
