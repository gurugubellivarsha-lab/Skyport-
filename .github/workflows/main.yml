
name: Windows RDP NRB + Minecraft

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-rdp:
    runs-on: windows-2025
    timeout-minutes: 350

    steps:
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - name: Verify Java
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          java -version
          if ($LASTEXITCODE -ne 0) {
            throw "Java installation failed."
          }

      - name: Configure RDP Account
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $username = "NRB"
          $password = "NRB"
          $secure = ConvertTo-SecureString $password -AsPlainText -Force

          if (Get-LocalUser -Name $username -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name $username -Password $secure
          } else {
            New-LocalUser -Name $username `
              -Password $secure `
              -PasswordNeverExpires
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name fDenyTSConnections -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-Service TermService -StartupType Automatic
          Start-Service TermService

          Write-Host "RDP account configured."
          Write-Host "Username: NRB"

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Install Minecraft Launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          winget install `
            --id Mojang.MinecraftLauncher `
            --exact `
            --silent `
            --accept-source-agreements `
            --accept-package-agreements `
            --disable-interactivity

          if ($LASTEXITCODE -ne 0) {
            throw "Minecraft Launcher installation failed."
          }

      - name: Show RDP Connection
        shell: pwsh
        run: |
          $ip = (tailscale ip -4 | Select-Object -First 1).Trim()

          Write-Host "================================"
          Write-Host "RDP ADDRESS: ${ip}:3389"
          Write-Host "USERNAME: NRB"
          Write-Host "PASSWORD: NRB"
          Write-Host "================================"
          Write-Host "Keep this workflow running."

          while ($true) {
            Start-Sleep -Seconds 30
          }
