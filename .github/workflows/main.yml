
name: Windows RDP NRB Minecraft

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-rdp:
    runs-on: windows-2025
    timeout-minutes: 350

    steps:
      - name: Install Java for Minecraft
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - name: Verify Java
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          java -version
          if ($LASTEXITCODE -ne 0) {
            throw "Java installation failed."
          }

      - name: Configure RDP Account
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Add RDP_PASSWORD in GitHub Secrets."
          }

          if ($env:RDP_PASSWORD.Length -lt 12) {
            throw "RDP_PASSWORD must be at least 12 characters."
          }

          $username = "NRB"
          $secure = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          $user = Get-LocalUser -Name $username `
            -ErrorAction SilentlyContinue

          if ($null -eq $user) {
            New-LocalUser -Name $username `
              -Password $secure `
              -PasswordNeverExpires
          } else {
            Set-LocalUser -Name $username -Password $secure
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name fDenyTSConnections -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-Service TermService -StartupType Automatic
          Start-Service TermService

          Write-Host "RDP account configured."
          Write-Host "Username: NRB"

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Install Minecraft Launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          winget install `
            --id Mojang.MinecraftLauncher `
            --exact `
            --silent `
            --accept-source-agreements `
            --accept-package-agreements `
            --disable-interactivity

          if ($LASTEXITCODE -ne 0) {
            throw "Minecraft Launcher installation failed."
          }

      - name: Show Connection Details
        shell: pwsh
        run: |
          $ip = (tailscale ip -4 | Select-Object -First 1).Trim()

          Write-Host "RDP address: ${ip}:3389"
          Write-Host "Username: NRB"
          Write-Host "Use your RDP_PASSWORD GitHub Secret."
          Write-Host "Keep the workflow running."

          while ($true) {
            Start-Sleep -Seconds 30
          }
          
